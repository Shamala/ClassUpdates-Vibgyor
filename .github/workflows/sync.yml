name: Sync class updates

# Runs itself daily and can also be triggered by hand.
#
# Cron is in UTC: 09:15 UTC is 14:45 IST. GitHub's scheduler is best-effort and
# runs late under load - sometimes by tens of minutes, occasionally not at all -
# and the load piles up on the hour and half hour, so an odd minute like :15 is
# deliberately chosen. A repository with no activity for 60 days has its
# schedules disabled, so this stops if the project goes quiet.
on:
  schedule:
    - cron: "15 9 * * *"   # 14:45 IST, daily
  workflow_dispatch:
    inputs:
      publish:
        description: "Republish the board (leave off for a dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Shares a queue with the Pages deploy: this job publishes the site itself, and
# two deployments at once would fight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The portal credentials are environment secrets, and an environment secret
    # only reaches a job that names its environment. Without this line they
    # arrive empty and the job stops before it signs in.
    environment: github-pages
    env:
      # A scheduled run always publishes; a manual one only when asked.
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install headless browser
        run: python -m playwright install --with-deps chromium

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # This repository is public, so this job's logs are public too. The sync
      # step prints counts only and redacts anything scraped; keep it that way.
      - name: Sync from Orion
        id: sync
        env:
          ORION_USERNAME: ${{ secrets.ORION_USERNAME }}
          ORION_PASSWORD: ${{ secrets.ORION_PASSWORD }}
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
          PUBLISH_AFTER_SYNC: ${{ env.PUBLISH }}
        run: python -m backend.scheduled_sync

      # A push made with GITHUB_TOKEN deliberately does not start another
      # workflow, so committing the bundle never reaches Pages on its own. This
      # job therefore deploys the site it just built rather than waiting for a
      # deploy that will not come.
      - name: Set up Node
        if: steps.sync.outputs.published == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # The stylesheet is compiled from the classes actually used in the markup,
      # so it has to be rebuilt whenever that markup changes. Building here means
      # the published CSS can never lag behind the page it styles.
      - name: Build stylesheet
        if: steps.sync.outputs.published == 'true'
        run: |
          npm ci
          npm run build:css

      - name: Setup Pages
        if: steps.sync.outputs.published == 'true'
        uses: actions/configure-pages@v6

      - name: Inject web analytics
        if: steps.sync.outputs.published == 'true'
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: python3 scripts/inject_analytics.py

      - name: Upload Pages artifact
        if: steps.sync.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'frontend'

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.published == 'true'
        uses: actions/deploy-pages@v5
