name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # The site code is not sensitive; keeping it out of the repository is what
      # makes analytics off by default for anyone who clones or forks this.
      - name: Inject web analytics
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: python3 scripts/inject_analytics.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the entire frontend directory
          path: 'frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
