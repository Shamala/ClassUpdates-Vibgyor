name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # GoatCounter counts unique visitors per day from a salted hash of IP and
      # user agent that rotates daily, so it needs no cookie and stores no
      # identifier on the visitor's device. The site code is not sensitive; keeping
      # it out of the repository is what makes analytics off by default for anyone
      # who clones or forks this.
      - name: Inject web analytics
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: |
          python3 - <<'PY'
          import html as html_mod
          import os

          code = (os.environ.get("GOATCOUNTER_CODE") or "").strip()
          path = "frontend/index.html"
          marker = "<!--WEB_ANALYTICS-->"

          with open(path) as fh:
              page = fh.read()

          if not code:
              print("GOATCOUNTER_CODE is not set: publishing with no analytics script.")
          elif marker not in page:
              raise SystemExit(f"Expected marker {marker} in {path}")
          else:
              # accept either a bare site code or a full counter endpoint
              endpoint = code if "://" in code else f"https://{code}.goatcounter.com/count"
              tag = (
                  '<script data-goatcounter="%s" async '
                  'src="https://gc.zgo.at/count.js"></script>'
                  % html_mod.escape(endpoint, quote=True)
              )
              with open(path, "w") as fh:
                  fh.write(page.replace(marker, tag))
              print("GoatCounter analytics injected.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the entire frontend directory
          path: 'frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
