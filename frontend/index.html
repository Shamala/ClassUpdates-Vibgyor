<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIBGYOR Class Updates | Parent Dashboard</title>
    <!-- PWA Manifest & Mobile App Tags -->
    <link rel="manifest" href="manifest.json" vite-ignore />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ClassUpdates" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" vite-ignore />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
      vite-ignore
    />
    <!-- Google Fonts: Commissioner -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind, compiled ahead of time by tailwind.config.js. The CDN build
         shipped a compiler to every visitor, warned against production use and
         needed a network round trip before anything could be styled. -->
    <link rel="stylesheet" href="tailwind.css" vite-ignore />
    <!-- Anti-flicker Dark Mode Detection -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          const supportDarkMode = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (theme === "dark" || (!theme && supportDarkMode)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" vite-ignore />
    <style>
      body {
        font-family:
          "Commissioner",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 flex flex-col transition-colors duration-200"
  >
    <!-- Top Rainbow Accent Bar -->
    <div class="vibgyor-strip w-full"></div>

    <!-- Main Navbar: drawn here by src/shell/Header.svelte -->
    <template id="header-slot"></template>

    <!-- Student name dialog: drawn here by src/shell/NameModal.svelte -->
    <template id="name-modal-slot"></template>

    <!-- Class Passcode Gate (published board only): drawn here by src/shell/PasscodeView.svelte -->
    <template id="passcode-view-slot"></template>

    <!-- Login Screen View (Shown when unauthenticated): drawn here by src/shell/LoginView.svelte -->
    <template id="login-view-slot"></template>

    <!-- Main Content Container (Dashboard View) -->
    <main
      id="dashboard-view"
      class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full"
    >
      <!-- Loading Indicator -->
      <div id="daily-content-loader" class="hidden text-center py-12">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"
        ></div>
        <p class="text-xs text-slate-500 font-semibold mt-2">
          Loading timetable updates...
        </p>
      </div>

      <!-- ==================== TAB 1: DAILY VIEW ==================== -->
      <!-- Drawn here by src/daily/DailyView.svelte -->
      <template id="view-daily-slot"></template>

      <!-- ==================== TAB 2: WEEKLY OVERVIEW ==================== -->
      <!-- Drawn here by src/weekly/WeeklyView.svelte -->
      <template id="view-weekly-slot"></template>

      <!-- ==================== TAB 3: CIRCULARS VIEW ==================== -->
      <!-- Drawn here by src/circulars/CircularsView.svelte -->
      <template id="view-circulars-slot"></template>
    </main>

    <!-- Word History Modal / Mobile Bottom Sheet: drawn here by src/words/WordHistoryModal.svelte -->
    <template id="word-modal-slot"></template>

    <!-- Circular Notice Modal: drawn here by src/circulars/NoticeModal.svelte -->
    <template id="notice-modal-slot"></template>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <!-- Pre-bundled Data for GitHub Pages & Offline Client-Side Mode -->
    <script src="class_data.enc.js" vite-ignore></script>
    <script src="static_data.js" vite-ignore></script>
    <!-- App Script -->
    <script type="module" src="src/main.js"></script>
    <!-- Visit counting. The analytics tag is injected here at deploy time, only
         when the GOATCOUNTER_CODE repository secret is set. Without it nothing is
         added and the page loads no third-party analytics at all. -->
    <!--WEB_ANALYTICS-->
  </body>
</html>
